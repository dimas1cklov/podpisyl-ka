<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BOOSTR — Follower Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=TikTok+Sans:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#app{width:1194px;height:834px;position:relative;overflow:hidden;background:#07070b;color:#fff;font-family:'TikTok Sans','Inter',system-ui,sans-serif;transform-origin:center center;flex-shrink:0;user-select:none}
@supports (overflow:clip){#app{overflow:clip}}
button{font-family:inherit}
.hidden{display:none!important}

/* glitch text */
.glitch{text-shadow:-3px -2px 0 rgba(37,244,238,.9),3px 2px 0 rgba(254,44,85,.9);animation:jit 3.2s infinite steps(1)}
.glitch-sm{text-shadow:-1.5px -1px 0 rgba(37,244,238,.9),1.5px 1px 0 rgba(254,44,85,.9)}
@keyframes jit{0%,88%,100%{text-shadow:-3px -2px 0 rgba(37,244,238,.9),3px 2px 0 rgba(254,44,85,.9);transform:none}
90%{text-shadow:-7px 0 0 rgba(37,244,238,.9),6px 2px 0 rgba(254,44,85,.9);transform:translateX(2px) skewX(-4deg)}
92%{text-shadow:4px -3px 0 rgba(37,244,238,.9),-5px 3px 0 rgba(254,44,85,.9);transform:translateX(-3px)}
94%{text-shadow:-2px 1px 0 rgba(37,244,238,.9),2px -1px 0 rgba(254,44,85,.9);transform:skewX(3deg)}}

/* background */
.bg{position:absolute;inset:0;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;mix-blend-mode:screen}
.b1{width:520px;height:520px;background:#25F4EE;left:-140px;top:-160px;animation:d1 16s ease-in-out infinite alternate}
.b2{width:560px;height:560px;background:#FE2C55;right:-160px;bottom:-200px;animation:d2 19s ease-in-out infinite alternate}
.b3{width:360px;height:360px;background:#7B2CFE;left:45%;top:40%;opacity:.35;animation:d3 13s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(380px,260px) scale(1.25)}}
@keyframes d2{to{transform:translate(-420px,-240px) scale(.85)}}
@keyframes d3{to{transform:translate(-300px,-200px) scale(1.4)}}
.grid{position:absolute;inset:-60px;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:60px 60px;animation:gm 6s linear infinite}
@keyframes gm{to{transform:translate(60px,60px)}}
.scan{position:absolute;left:0;right:0;height:120px;background:linear-gradient(180deg,transparent,rgba(37,244,238,.06),transparent);animation:sc 5s linear infinite}
@keyframes sc{from{top:-120px}to{top:834px}}
.fl{position:absolute;bottom:-60px;animation:rise linear infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0) rotate(0) scale(.7);opacity:0}10%{opacity:.85}80%{opacity:.6}100%{transform:translateY(-920px) rotate(40deg) scale(1.15);opacity:0}}
.eqrow{position:absolute;left:0;right:0;bottom:0;height:90px;display:flex;align-items:flex-end;justify-content:center;gap:8px;opacity:.22}
.eq{width:6px;border-radius:3px;background:linear-gradient(180deg,#25F4EE,#FE2C55);animation:eq 1.1s ease-in-out infinite alternate;transform-origin:bottom}
@keyframes eq{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
.disc{animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* header */
.header{position:absolute;top:0;left:0;right:0;height:88px;padding:0 40px;display:flex;align-items:center;justify-content:space-between;z-index:2}
.logo{display:flex;align-items:center;gap:14px}
.logo-box{width:48px;height:48px;border-radius:14px;background:#000;display:flex;align-items:center;justify-content:center;box-shadow:-3px -2px 0 #25F4EE,3px 2px 0 #FE2C55}
.logo-text{font-size:30px;font-weight:900;letter-spacing:-.5px}
.steps{display:flex;align-items:center;gap:10px}
.dot{height:8px;border-radius:99px;transition:all .3s;width:14px;background:rgba(255,255,255,.25)}
.dot.past{background:#fff}
.dot.cur{width:44px;background:linear-gradient(90deg,#25F4EE,#FE2C55)}
.steplabel{margin-left:8px;font-size:15px;font-weight:700;color:rgba(255,255,255,.75)}
.chip-fun{padding:9px 16px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:14px;font-weight:600;color:rgba(255,255,255,.8);backdrop-filter:blur(10px)}

/* screens */
.main{position:absolute;top:88px;left:0;right:0;bottom:0;z-index:1;display:flex;align-items:center;justify-content:center}
.screen{display:flex;flex-direction:column;align-items:center;margin-top:-40px;animation:in .45s ease-out}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
h1{margin:0}
.title{font-size:66px;font-weight:900;letter-spacing:-2px}
.sub{margin:0;font-size:22px;color:rgba(255,255,255,.7);font-weight:500}
.col{display:flex;flex-direction:column;align-items:center;gap:12px}
.row{display:flex;gap:18px}

.btn{cursor:pointer;border:0;transition:transform .15s,opacity .2s,box-shadow .2s;color:#fff}
.btn:hover{transform:scale(1.04)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-primary{height:72px;padding:0 72px;border-radius:99px;background:#FE2C55;font-size:24px;font-weight:800}
.btn-ghost{height:72px;padding:0 44px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);font-size:22px;font-weight:700}
.pulse{animation:pl 1.6s ease-in-out infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(254,44,85,.6)}50%{box-shadow:0 0 0 18px rgba(254,44,85,0)}}
.shine{animation:sh 2.4s ease-in-out infinite}
@keyframes sh{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}

.cards{display:flex;gap:36px}
.pcard{cursor:pointer;width:260px;height:290px;border-radius:32px;background:rgba(20,20,26,.72);backdrop-filter:blur(18px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;color:#fff;padding:0;border:2px solid rgba(255,255,255,.1);transition:transform .25s,box-shadow .25s,border-color .25s}
.pcard:hover{transform:translateY(-6px)}
.pcard.on{border-color:#fff;transform:translateY(-10px) scale(1.03);box-shadow:-6px -4px 0 #25F4EE,6px 4px 0 #FE2C55,0 30px 80px rgba(254,44,85,.35)}
.pcard .name{font-size:28px;font-weight:800}
.float{animation:fl 3.9s ease-in-out infinite;filter:drop-shadow(0 18px 24px rgba(0,0,0,.55))}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}

.field{width:640px;height:88px;border-radius:26px;background:rgba(22,22,30,.8);border:2px solid rgba(255,255,255,.14);display:flex;align-items:center;gap:8px;padding:0 12px 0 28px;backdrop-filter:blur(16px);transition:box-shadow .2s,border-color .2s}
.field:focus-within{border-color:#25F4EE;box-shadow:-4px -3px 0 rgba(37,244,238,.7),4px 3px 0 rgba(254,44,85,.7)}
.field .at{font-size:36px;font-weight:800;color:#25F4EE}
.inp{flex:1;min-width:0;background:transparent;border:0;color:#fff;font-family:inherit;font-size:34px;font-weight:700;outline:none;user-select:text}
.inp::placeholder{color:rgba(255,255,255,.3)}
.paste{height:62px;padding:0 22px;border-radius:18px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px;flex-shrink:0}
.paste:hover{background:#25F4EE;color:#000}

.pill{display:flex;align-items:center;gap:12px;padding:8px 18px 8px 8px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:18px;font-weight:700}
.big{font-size:140px;line-height:1;font-weight:900;letter-spacing:-5px}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:99px;outline:none;cursor:pointer;margin:0}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:-4px -2px 0 #25F4EE,4px 2px 0 #FE2C55,0 6px 20px rgba(0,0,0,.5);cursor:grab}
.rng::-moz-range-thumb{width:44px;height:44px;border:0;border-radius:50%;background:#fff;box-shadow:-4px -2px 0 #25F4EE,4px 2px 0 #FE2C55;cursor:grab}
.chip{height:52px;padding:0 26px;border-radius:99px;font-size:18px;font-weight:800;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18)}
.chip.on{color:#000;background:#25F4EE;border-color:#25F4EE}

/* boost screen */
.boost{display:flex;gap:32px;align-items:stretch;height:700px;margin-top:-20px;animation:in .45s ease-out}
.profile{width:470px;border-radius:34px;background:#fff;color:#161823;overflow:hidden;display:flex;flex-direction:column;box-shadow:-8px -6px 0 rgba(37,244,238,.8),8px 6px 0 rgba(254,44,85,.8),0 40px 100px rgba(0,0,0,.6)}
.p-top{padding:22px 26px 0;display:flex;justify-content:space-between;align-items:center}
.p-head{padding:18px 26px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.p-name{font-size:40px;font-weight:900;letter-spacing:-1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:270px}
.p-user{font-size:17px;color:#6b6d76;font-weight:600}
.stats{display:flex;gap:26px;margin-top:16px}
.stat b{display:block;font-size:26px;font-weight:900}
.stat span{font-size:14px;color:#6b6d76}
.ava-wrap{position:relative;flex-shrink:0}
.ava{width:128px;height:128px;border-radius:50%;padding:4px;background:conic-gradient(#25F4EE,#FE2C55,#25F4EE)}
.ava img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 30%;border:4px solid #fff;display:block}
.ava-plus{position:absolute;right:-2px;bottom:4px;width:36px;height:36px;border-radius:50%;background:#20D5EC;border:3px solid #fff;display:flex;align-items:center;justify-content:center}
.p-btns{padding:18px 26px 0;display:flex;gap:10px}
.p-btns div{flex:1;height:44px;border-radius:12px;background:#f1f1f2;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.tabs{margin-top:16px;display:flex;border-bottom:1px solid #e3e3e4}
.tabs div{flex:1;height:48px;display:flex;align-items:center;justify-content:center}
.tabs .act{border-bottom:3px solid #161823}
.posts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;padding-top:2px;align-content:start}
.post{position:relative;overflow:hidden;background:#222;aspect-ratio:3/4}
.post img{width:100%;height:100%;object-fit:cover;display:block}
.post .v{position:absolute;left:8px;bottom:6px;display:flex;align-items:center;gap:4px;color:#fff;font-size:14px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.7)}

.panel{width:520px;border-radius:34px;background:rgba(18,18,24,.78);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(20px);padding:34px;display:flex;flex-direction:column;gap:22px}
.kicker{font-size:15px;font-weight:700;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:2px}
.counter{font-size:92px;line-height:1;font-weight:900;letter-spacing:-3px}
.track{height:16px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bar{height:100%;border-radius:99px;width:0;background:linear-gradient(90deg,#25F4EE,#FE2C55,#25F4EE);background-size:200% 100%;animation:bm 1.2s linear infinite}
@keyframes bm{to{background-position:-200% 0}}
.meta{display:flex;justify-content:space-between;font-size:15px;font-weight:700;color:rgba(255,255,255,.6)}
.feed{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden}
.fitem{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.06)}
.fitem.new{animation:pp .6s ease-out}
@keyframes pp{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.fav{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#000}
.fname{flex:1;font-size:17px;font-weight:700}
.fverb{font-size:14px;font-weight:700;color:#25F4EE}
.done-row{display:flex;gap:12px;animation:in .45s ease-out}
.done-row .btn{flex:1;height:64px;font-size:19px}

.vinyl{position:absolute;right:36px;bottom:32px;z-index:2}
.vinyl .disc{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle,#2b2b2f 0 38%,#111 39% 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px rgba(255,255,255,.08)}
.vinyl .core{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#25F4EE,#FE2C55);display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="stage">
<div id="app">

  <!-- animated background -->
  <div class="bg" aria-hidden="true">
    <div class="grid"></div>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="scan"></div>
    <div id="particles"></div>
    <div class="eqrow" id="eq"></div>
  </div>

  <!-- header -->
  <div class="header">
    <div class="logo">
      <div class="logo-box">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6 4 4 7-8"/><path d="M15 7h6v6"/></svg>
      </div>
      <div class="logo-text glitch">BOOSTR</div>
    </div>
    <div class="steps" id="steps">
      <div class="dot" data-n="1"></div><div class="dot" data-n="2"></div><div class="dot" data-n="3"></div>
      <div class="steplabel">Step <span id="stepNo">1</span> of 3</div>
    </div>
    <div class="chip-fun">Just for fun · simulation</div>
  </div>

  <div class="main">

    <!-- 1. platform -->
    <div class="screen" id="s-platform" style="gap:44px">
      <div class="col">
        <h1 class="title glitch" style="font-size:68px">Pick your platform</h1>
        <p class="sub">Where should the followers land?</p>
      </div>
      <div class="cards" id="cards"></div>
      <button class="btn btn-primary" id="toNick1" disabled>Continue</button>
    </div>

    <!-- 2. nickname -->
    <div class="screen hidden" id="s-nick" style="gap:40px">
      <img class="float pf-icon" alt="" style="width:110px;height:110px;object-fit:contain">
      <div class="col">
        <h1 class="title glitch">What's your username?</h1>
        <p class="sub">Type your <span class="pf-name"></span> nickname</p>
      </div>
      <div class="field">
        <span class="at">@</span>
        <input class="inp" id="nick" placeholder="username" maxlength="24" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Username">
        <button class="btn paste" id="paste" aria-label="Paste a random username">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg>Paste
        </button>
      </div>
      <div class="row">
        <button class="btn btn-ghost" id="backPlatform">Back</button>
        <button class="btn btn-primary" id="toAmount" disabled>Continue</button>
      </div>
    </div>

    <!-- 3. amount -->
    <div class="screen hidden" id="s-amount" style="gap:30px">
      <div class="pill"><img class="pf-icon" alt="" style="width:36px;height:36px;object-fit:contain"><span>@<span class="nick-out"></span></span></div>
      <h1 style="font-size:44px;font-weight:800;color:rgba(255,255,255,.85)">How many <span class="pf-label"></span>?</h1>
      <div class="big glitch" id="amountBig">10,000</div>
      <div style="width:700px;display:flex;flex-direction:column;gap:14px">
        <input class="rng" id="slider" type="range" min="0" max="1000" step="1" value="500" aria-label="Amount">
        <div class="meta" style="font-size:16px;color:rgba(255,255,255,.55)"><span>100</span><span>1M</span></div>
      </div>
      <div class="row" style="gap:12px" id="chips"></div>
      <div class="row" style="margin-top:6px">
        <button class="btn btn-ghost" id="backNick" style="height:76px">Back</button>
        <button class="btn btn-primary pulse" id="ok" style="height:76px;padding:0 96px;font-size:28px;font-weight:900;letter-spacing:1px">OK</button>
      </div>
    </div>

    <!-- 4. boosting -->
    <div class="boost hidden" id="s-boost">
      <div class="profile">
        <div class="p-top">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#161823" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4L8 20H4v-4z"/></svg>
          <div style="display:flex;gap:22px;align-items:center">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#161823" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3.1-6.5 7-6.5s7 2.5 7 6.5"/><path d="M19 8v6M16 11h6"/></svg>
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#161823" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </div>
        </div>
        <div class="p-head">
          <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
            <div class="p-name" id="pName">Username</div>
            <div class="p-user">@<span class="nick-out"></span></div>
            <div class="stats">
              <div class="stat"><b>50</b><span>Following</span></div>
              <div class="stat"><b id="pFollowers">5</b><span id="pLabel">Followers</span></div>
              <div class="stat"><b id="pLikes">0</b><span>Likes</span></div>
            </div>

  var eh = '';
  for (var k = 0; k < 60; k++) {
    eh += '<div class="eq" style="height:' + (30 + (k * 37) % 60) + 'px;animation-delay:-' + ((k * 0.13) % 1.1).toFixed(2) + 's;animation-duration:' + (0.7 + (k * 0.07) % 0.8).toFixed(2) + 's"></div>';
  }
  $('eq').innerHTML = eh;

  // ===== platform cards =====
  PLATFORMS.forEach(function (p) {
    var b = document.createElement('button');
    b.className = 'pcard';
    b.setAttribute('aria-label', p.name);
    b.innerHTML = '<img class="float" src="' + IMG[p.id] + '" alt="" style="width:' + p.w + 'px;height:140px;object-fit:contain;animation-delay:' + p.delay + '"><div class="name">' + p.name + '</div>';
    b.onclick = function () { state.platform = p.id; render(); };
    b.dataset.id = p.id;
    $('cards').appendChild(b);
  });

  // ===== amount chips =====
  [1e3, 1e4, 1e5, 1e6].forEach(function (v) {
    var b = document.createElement('button');
    b.className = 'btn chip';
    b.textContent = fmtShort(v);
    b.dataset.v = v;
    b.onclick = function () { state.t = Math.round((Math.log10(v) - 2) * 250); render(); };
    $('chips').appendChild(b);
  });

  // ===== navigation =====
  function go(step) {
    clearInterval(timer);
    state.step = step;
    render();
    if (step === 'nick') setTimeout(function () { $('nick').focus(); }, 50);
  }
  $('toNick1').onclick = function () { go('nick'); };
  $('backPlatform').onclick = function () { go('platform'); };
  $('toAmount').onclick = function () { go('amount'); };
  $('backNick').onclick = function () { go('nick'); };
  $('changeAmount').onclick = function () { go('amount'); };
  $('again').onclick = function () { go('platform'); };
  $('paste').onclick = function () { state.nick = randomNick(); $('nick').value = state.nick; render(); };
  $('nick').oninput = function (e) {
    var clean = e.target.value.replace(/[^A-Za-z0-9_.]/g, '');
    if (clean !== e.target.value) e.target.value = clean;
    state.nick = clean; render();
  };
  $('nick').onkeydown = function (e) { if (e.key === 'Enter' && state.nick.trim()) go('amount'); };
  $('slider').oninput = function (e) { state.t = Number(e.target.value); render(); };
  $('ok').onclick = startBoost;

  // ===== the boost =====
  function startBoost() {
    clearInterval(timer);
    var amount = amountFromT(state.t);
    var tick = 50;
    var N = Math.round(BOOST_SECONDS * 1000 / tick);
    var i = 0;
    var feed = [];
    state.step = 'boost';
    render();
    $('feed').innerHTML = '';
    $('doneRow').classList.add('hidden');
    updateBoost(0, 0, amount);
    timer = setInterval(function () {
      i++;
      var p = Math.min(1, i / N);
      var e = 1 - Math.pow(1 - p, 3);
      var gained = Math.round(amount * e);
      if (i % 6 === 0 && p < 1) addFeed();
      updateBoost(p, gained, amount);
      if (p >= 1) {
        clearInterval(timer);
        $('status').textContent = 'Boost complete';
        $('doneRow').classList.remove('hidden');
      }
    }, tick);
  }
  function addFeed() {
    var name = '@' + pick(NAMES);
    var verb = Math.random() < 0.7 ? 'followed you' : 'liked your video';
    var el = document.createElement('div');
    el.className = 'fitem new';
    el.innerHTML = '<div class="fav" style="background:' + pick(COLORS) + '">' + name.charAt(1).toUpperCase() + '</div><div class="fname">' + name + '</div><div class="fverb">' + verb + '</div>';
    var list = $('feed');
    list.insertBefore(el, list.firstChild);
    while (list.children.length > 5) list.removeChild(list.lastChild);
  }
  function updateBoost(p, gained, amount) {
    var followers = START_FOLLOWERS + gained;
    var pct = Math.round(p * 100);
    $('status').textContent = p >= 1 ? 'Boost complete' : 'Boosting…';
    $('gained').textContent = fmtFull(gained);
    $('amountOf').textContent = fmtFull(amount);
    $('bar').style.width = pct + '%';
    $('pct').textContent = pct + '%';
    $('total').textContent = fmtFull(followers);
    $('pFollowers').textContent = fmtShort(followers);
    $('pLikes').textContent = fmtShort(Math.round(gained * 2.7));
    $('v1').textContent = fmtShort(Math.round(followers * 0.42 * 3) + 12);
    $('v2').textContent = fmtShort(Math.round(followers * 0.18 * 3) + 12);
  }

  // ===== render =====
  function render() {
    var s = state, pf = platform();
    $('app').scrollTop = 0; $('app').scrollLeft = 0;
    var nick = s.nick.trim() || 'username';
    var stepNo = s.step === 'platform' ? 1 : s.step === 'nick' ? 2 : 3;
    var amount = amountFromT(s.t);

    $('s-platform').classList.toggle('hidden', s.step !== 'platform');
    $('s-nick').classList.toggle('hidden', s.step !== 'nick');
    $('s-amount').classList.toggle('hidden', s.step !== 'amount');
    $('s-boost').classList.toggle('hidden', s.step !== 'boost');
    $('steps').style.visibility = s.step === 'boost' ? 'hidden' : 'visible';
    $('vinyl').classList.toggle('hidden', s.step === 'boost');

    all('.dot').forEach(function (d) {
      var n = Number(d.dataset.n);
      d.className = 'dot' + (n === stepNo ? ' cur' : n < stepNo ? ' past' : '');
    });
    $('stepNo').textContent = stepNo;

    all('.pcard').forEach(function (c) { c.classList.toggle('on', c.dataset.id === s.platform); });
    $('toNick1').disabled = !s.platform;

    all('.pf-icon').forEach(function (im) { im.src = IMG[pf.id]; });
    all('.pf-name').forEach(function (el) { el.textContent = pf.name; });
    all('.pf-label').forEach(function (el) { el.textContent = pf.label; });
    all('.nick-out').forEach(function (el) { el.textContent = nick; });
    $('toAmount').disabled = !s.nick.trim();

    $('amountBig').textContent = fmtFull(amount);
    var sl = $('slider');
    if (Number(sl.value) !== s.t) sl.value = s.t;
    var tp = s.t / 10;
    sl.style.background = 'linear-gradient(90deg,#25F4EE 0%,#FE2C55 ' + tp + '%,rgba(255,255,255,.14) ' + tp + '%)';
    all('.chip').forEach(function (c) { c.classList.toggle('on', Number(c.dataset.v) === amount); });

    $('pName').textContent = nick.charAt(0).toUpperCase() + nick.slice(1);
    $('pLabel').textContent = pf.label.charAt(0).toUpperCase() + pf.label.slice(1);
    $('pFollowers').style.color = pf.accent;
  }

  render();
})();
</script>
</body>
</html>
